name: Feishu Bridge Artifacts

on:
  push:
    branches:
      - feat/feishu-bridge-go
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Feishu Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Verify synced version files
        run: ./scripts/check-version-sync.sh

      - name: Build desktop frontend
        run: |
          npm ci --prefix desktop/frontend
          npm run build --prefix desktop/frontend

      - name: Run Go tests
        run: go test ./...

      - name: Build CLI smoke
        run: go build -o lingma-ipc-proxy ./cmd/lingma-ipc-proxy

  build-desktop-macos:
    name: Build Feishu Desktop macOS
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: npm ci --prefix desktop/frontend

      - name: Set artifact label
        run: echo "BUILD_LABEL=feishu-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build app
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          cd desktop
          ldflags="-X main.devtoolsBuild=true"
          if [ -n "$R2_PUBLIC_BASE_URL" ] && [ -n "$UPDATE_SIGNING_PUBLIC_KEY" ]; then
            base="${R2_PUBLIC_BASE_URL%/}"
            ldflags="$ldflags -X main.updateManifestURL=$base/updates/feishu/stable/manifest.json"
            ldflags="$ldflags -X main.promptPackManifestURL=$base/prompt-pack/feishu/stable/manifest.json"
            ldflags="$ldflags -X main.updatePublicKey=$UPDATE_SIGNING_PUBLIC_KEY"
            ldflags="$ldflags -X main.promptPackPublicKey=$UPDATE_SIGNING_PUBLIC_KEY"
          fi
          wails build -platform darwin/arm64 -clean -devtools -ldflags "$ldflags"

      - name: Package app
        run: |
          APP_PATH="$(find desktop/build/bin -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test "$(basename "$APP_PATH")" = "Lingma Proxy.app"
          DMG_ROOT="$(mktemp -d)"
          cp -R "$APP_PATH" "$DMG_ROOT/"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create \
            -volname "Lingma Proxy Feishu" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "lingma-proxy-feishu-desktop_${BUILD_LABEL}_darwin_arm64.dmg"
          rm -rf "$DMG_ROOT"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: feishu-desktop-macos
          retention-days: 14
          path: lingma-proxy-feishu-desktop_${{ env.BUILD_LABEL }}_darwin_arm64.dmg

  build-desktop-windows:
    name: Build Feishu Desktop Windows
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: npm ci --prefix desktop/frontend

      - name: Set artifact label
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          "BUILD_LABEL=feishu-$short" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build app
        shell: pwsh
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          Push-Location desktop
          $ldflags = "-X main.devtoolsBuild=true"
          if ($env:R2_PUBLIC_BASE_URL -and $env:UPDATE_SIGNING_PUBLIC_KEY) {
            $base = $env:R2_PUBLIC_BASE_URL.TrimEnd("/")
            $ldflags = "$ldflags -X main.updateManifestURL=$base/updates/feishu/stable/manifest.json"
            $ldflags = "$ldflags -X main.promptPackManifestURL=$base/prompt-pack/feishu/stable/manifest.json"
            $ldflags = "$ldflags -X main.updatePublicKey=$env:UPDATE_SIGNING_PUBLIC_KEY"
            $ldflags = "$ldflags -X main.promptPackPublicKey=$env:UPDATE_SIGNING_PUBLIC_KEY"
          }
          wails build -platform windows/amd64 -clean -devtools -ldflags $ldflags
          Pop-Location

      - name: Package app
        shell: pwsh
        run: |
          $exe = Get-ChildItem .\desktop\build\bin -Filter *.exe | Where-Object { $_.Name -notlike "*installer*" } | Select-Object -First 1
          if (-not $exe) { throw "Desktop portable exe was not produced" }
          $asset = "lingma-proxy-feishu-desktop_${env:BUILD_LABEL}_windows_amd64.exe"
          Copy-Item -Path $exe.FullName -Destination $asset -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: feishu-desktop-windows
          retention-days: 14
          path: lingma-proxy-feishu-desktop_${{ env.BUILD_LABEL }}_windows_amd64.exe

  publish-r2:
    name: Publish Feishu OTA to R2
    runs-on: ubuntu-latest
    needs:
      - build-desktop-macos
      - build-desktop-windows
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check R2 publish secrets
        id: r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_BUCKET" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_PUBLIC_BASE_URL" ] && [ -n "$UPDATE_SIGNING_PRIVATE_KEY" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "R2 publish skipped: one or more Cloudflare/R2/update signing secrets are not configured."
          fi

      - name: Download macOS artifact
        if: steps.r2.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: feishu-desktop-macos
          path: dist

      - name: Download Windows artifact
        if: steps.r2.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: feishu-desktop-windows
          path: dist

      - name: Prepare signed manifests
        if: steps.r2.outputs.enabled == 'true'
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="$(jq -r '.info.productVersion' desktop/wails.json)"
          short="${GITHUB_SHA::7}"
          release_prefix="releases/feishu/v${version}/feishu-${short}"
          public_base="${R2_PUBLIC_BASE_URL%/}"

          mac_asset="$(find dist -maxdepth 1 -name '*darwin_arm64.dmg' -print -quit)"
          win_asset="$(find dist -maxdepth 1 -name '*windows_amd64.exe' -print -quit)"
          test -n "$mac_asset"
          test -n "$win_asset"

          mac_name="$(basename "$mac_asset")"
          win_name="$(basename "$win_asset")"
          mac_sha="$(sha256sum "$mac_asset" | awk '{print $1}')"
          win_sha="$(sha256sum "$win_asset" | awk '{print $1}')"
          mac_sig="$(go run scripts/sign-update-sha.go "$mac_sha")"
          win_sig="$(go run scripts/sign-update-sha.go "$win_sha")"
          mac_size="$(stat -c%s "$mac_asset")"
          win_size="$(stat -c%s "$win_asset")"

          mkdir -p dist/manifests dist/prompt-pack
          VERSION="$version" PUBLIC_BASE="$public_base" RELEASE_PREFIX="$release_prefix" MAC_NAME="$mac_name" WIN_NAME="$win_name" MAC_SHA="$mac_sha" WIN_SHA="$win_sha" MAC_SIG="$mac_sig" WIN_SIG="$win_sig" MAC_SIZE="$mac_size" WIN_SIZE="$win_size" python3 - <<'PY'
          import json
          import os

          public_base = os.environ["PUBLIC_BASE"]
          release_prefix = os.environ["RELEASE_PREFIX"]
          manifest = {
              "schemaVersion": 1,
              "channel": "feishu-stable",
              "version": os.environ["VERSION"],
              "minSupportedVersion": "1.6.7",
              "mandatory": False,
              "releaseNotes": "\n".join([
                  "v1.6.7 Feishu Agent 稳定版",
                  "• 增强飞书文档、云盘、表格、权限、日历和消息工具链。",
                  "• 支持长文档/长表格分页读取、完整输出和多卡片续发。",
                  "• 新增上下文预算、自动压缩、工具记忆检索和飞书历史搜索。",
                  "• 接入 MCP、Bridge Skills、定时任务、Web/HTTP/天气和安全文件工具。",
                  "• 新增官网下载、教程、更新日志、R2 OTA manifest 和 Prompt Pack 更新。",
                  "Build " + os.environ.get("GITHUB_SHA", "")[:7],
              ]),
              "assets": {
                  "darwin-arm64": {
                      "url": f"{public_base}/{release_prefix}/{os.environ['MAC_NAME']}",
                      "filename": os.environ["MAC_NAME"],
                      "sha256": os.environ["MAC_SHA"],
                      "signature": os.environ["MAC_SIG"],
                      "size": int(os.environ["MAC_SIZE"]),
                      "kind": "dmg",
                  },
                  "windows-amd64": {
                      "url": f"{public_base}/{release_prefix}/{os.environ['WIN_NAME']}",
                      "filename": os.environ["WIN_NAME"],
                      "sha256": os.environ["WIN_SHA"],
                      "signature": os.environ["WIN_SIG"],
                      "size": int(os.environ["WIN_SIZE"]),
                      "kind": "portable-exe",
                  },
              },
          }
          with open("dist/manifests/update-manifest.json", "w", encoding="utf-8") as f:
              f.write(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

          python3 - <<'PY'
          import json, pathlib
          base = pathlib.Path("internal/feishu/prompt_rules")
          order = ["base", "feishu_cli_rules", "tool_error_recovery", "long_document_rules", "permission_rules", "skill_rules"]
          modules = {name: (base / f"{name}.md").read_text(encoding="utf-8").strip() for name in order}
          pack = {
            "schemaVersion": 1,
            "channel": "feishu-stable",
            "version": "2026.05.28.1",
            "minAppVersion": "1.6.7",
            "moduleOrder": order,
            "modules": modules,
            "notes": "Built-in Feishu CLI prompt rules."
          }
          pathlib.Path("dist/prompt-pack/prompt-pack.json").write_text(json.dumps(pack, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          pack_sha="$(sha256sum dist/prompt-pack/prompt-pack.json | awk '{print $1}')"
          pack_sig="$(go run scripts/sign-update-sha.go "$pack_sha")"
          PUBLIC_BASE="$public_base" PACK_SHA="$pack_sha" PACK_SIG="$pack_sig" python3 - <<'PY'
          import json
          import os
          manifest = {
            "schemaVersion": 1,
            "channel": "feishu-stable",
            "version": "2026.05.28.1",
            "minAppVersion": "1.6.7",
            "url": os.environ["PUBLIC_BASE"] + "/prompt-pack/feishu/stable/prompt-pack.json",
            "sha256": os.environ["PACK_SHA"],
            "signature": os.environ["PACK_SIG"],
            "notes": "Built-in Feishu CLI prompt rules."
          }
          open("dist/prompt-pack/manifest.json", "w", encoding="utf-8").write(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

          echo "RELEASE_PREFIX=$release_prefix" >> "$GITHUB_ENV"
          echo "MAC_ASSET=$mac_asset" >> "$GITHUB_ENV"
          echo "WIN_ASSET=$win_asset" >> "$GITHUB_ENV"

      - name: Prepare site runtime config
        if: steps.r2.outputs.enabled == 'true'
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          public_base="${R2_PUBLIC_BASE_URL%/}"
          {
            echo "window.LINGMA_SITE_CONFIG = {"
            echo "  updateManifestUrl: \"${public_base}/updates/feishu/stable/manifest.json\","
            echo "  promptPackManifestUrl: \"${public_base}/prompt-pack/feishu/stable/manifest.json\","
            echo "};"
          } > site/config.js

      - name: Upload to R2
        if: steps.r2.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          upload_file() {
            local src="$1"
            local key="$2"
            local content_type="$3"
            aws s3 cp "$src" "s3://${R2_BUCKET}/${key}" \
              --endpoint-url "$endpoint" \
              --content-type "$content_type" \
              --no-progress
          }

          upload_file "$MAC_ASSET" "${RELEASE_PREFIX}/$(basename "$MAC_ASSET")" "application/x-apple-diskimage"
          upload_file "$WIN_ASSET" "${RELEASE_PREFIX}/$(basename "$WIN_ASSET")" "application/vnd.microsoft.portable-executable"
          upload_file dist/manifests/update-manifest.json "updates/feishu/stable/manifest.json" "application/json"
          upload_file dist/prompt-pack/prompt-pack.json "prompt-pack/feishu/stable/prompt-pack.json" "application/json"
          upload_file dist/prompt-pack/manifest.json "prompt-pack/feishu/stable/manifest.json" "application/json"
          while IFS= read -r file; do
            rel="${file#site/}"
            case "$file" in
              *.html) ct="text/html; charset=utf-8" ;;
              *.css) ct="text/css; charset=utf-8" ;;
              *.js) ct="application/javascript; charset=utf-8" ;;
              *) ct="application/octet-stream" ;;
            esac
            upload_file "$file" "site/${rel}" "$ct"
          done < <(find site -type f | sort)
          npx wrangler@latest r2 bucket cors set "${R2_BUCKET}" --file .github/r2-cors.json

      - name: Deploy site to Cloudflare Pages
        if: steps.r2.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "Cloudflare Pages deploy skipped: Pages secrets are not configured."
            exit 0
          fi
          npx wrangler@latest pages deploy site --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch stable
