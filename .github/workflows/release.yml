name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.3.2"
        required: true

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Verify synced version files
        run: ./scripts/check-version-sync.sh

      - name: Verify release notes entry
        run: ./scripts/check-release-notes.sh

      - name: Build desktop frontend
        run: |
          npm ci --prefix desktop/frontend
          npm run build --prefix desktop/frontend

      - name: Run tests
        run: go test ./...

  build-cli-macos:
    name: Build CLI macOS
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/lingma-proxy ./cmd/lingma-ipc-proxy
          tar -C dist -czf "lingma-proxy_${RELEASE_TAG}_darwin_arm64.tar.gz" lingma-proxy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-macos
          path: lingma-proxy_${{ env.RELEASE_TAG }}_darwin_arm64.tar.gz

  build-cli-windows:
    name: Build CLI Windows
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI
        shell: pwsh
        run: |
          .\scripts\build.ps1 -Clean
          $asset = "lingma-proxy_${env:RELEASE_TAG}_windows_amd64.zip"
          Compress-Archive -Path .\dist\lingma-proxy.exe -DestinationPath $asset -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-windows
          path: lingma-proxy_${{ env.RELEASE_TAG }}_windows_amd64.zip

  build-cli-linux:
    name: Build CLI Linux
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -ldflags "-s -w" -o dist/lingma-proxy ./cmd/lingma-ipc-proxy
          tar -C dist -czf "lingma-proxy_${RELEASE_TAG}_linux_${{ matrix.arch }}.tar.gz" lingma-proxy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: lingma-proxy_${{ env.RELEASE_TAG }}_linux_${{ matrix.arch }}.tar.gz

  build-desktop-macos:
    name: Build Desktop macOS
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: npm ci --prefix desktop/frontend

      - name: Build app
        run: |
          cd desktop
          wails build -platform darwin/arm64 -clean

      - name: Package app
        run: |
          APP_PATH="$(find desktop/build/bin -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test "$(basename "$APP_PATH")" = "Lingma Proxy.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "lingma-proxy-desktop_${RELEASE_TAG}_darwin_arm64.zip"
          DMG_ROOT="$(mktemp -d)"
          cp -R "$APP_PATH" "$DMG_ROOT/"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create \
            -volname "Lingma Proxy" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "lingma-proxy-desktop_${RELEASE_TAG}_darwin_arm64.dmg"
          rm -rf "$DMG_ROOT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            lingma-proxy-desktop_${{ env.RELEASE_TAG }}_darwin_arm64.zip
            lingma-proxy-desktop_${{ env.RELEASE_TAG }}_darwin_arm64.dmg

  build-desktop-windows:
    name: Build Desktop Windows
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: npm ci --prefix desktop/frontend

      - name: Build app
        shell: pwsh
        run: |
          Push-Location desktop
          wails build -platform windows/amd64 -clean
          Pop-Location

      - name: Package app
        shell: pwsh
        run: |
          $exe = Get-ChildItem .\desktop\build\bin -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Desktop exe was not produced" }
          if ($exe.Name -ne "LingmaProxy.exe") { throw "Unexpected desktop exe name: $($exe.Name)" }
          $asset = "lingma-proxy-desktop_${env:RELEASE_TAG}_windows_amd64.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $asset -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: lingma-proxy-desktop_${{ env.RELEASE_TAG }}_windows_amd64.zip

  build-desktop-linux:
    name: Build Desktop Linux
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils

      - name: Install Wails and nFPM
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.1

      - name: Install frontend dependencies
        run: npm ci --prefix desktop/frontend

      - name: Build app
        run: |
          cd desktop
          wails build -platform linux/${{ matrix.arch }} -tags webkit2_41 -clean
          test -x build/bin/LingmaProxy

      - name: Package app
        run: |
          version="${RELEASE_TAG#v}"
          sed -e "s/__VERSION__/${version}/g" -e "s/__ARCH__/${{ matrix.arch }}/g" desktop/build/linux/nfpm-deb.yaml.in > /tmp/lingma-proxy-desktop-deb.yaml
          sed -e "s/__VERSION__/${version}/g" -e "s/__ARCH__/${{ matrix.arch }}/g" desktop/build/linux/nfpm-rpm.yaml.in > /tmp/lingma-proxy-desktop-rpm.yaml
          nfpm package -f /tmp/lingma-proxy-desktop-deb.yaml -p deb -t "lingma-proxy-desktop_${RELEASE_TAG}_linux_${{ matrix.arch }}.deb"
          nfpm package -f /tmp/lingma-proxy-desktop-rpm.yaml -p rpm -t "lingma-proxy-desktop_${RELEASE_TAG}_linux_${{ matrix.arch }}.rpm"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: |
            lingma-proxy-desktop_${{ env.RELEASE_TAG }}_linux_${{ matrix.arch }}.deb
            lingma-proxy-desktop_${{ env.RELEASE_TAG }}_linux_${{ matrix.arch }}.rpm

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-cli-macos
      - build-cli-windows
      - build-cli-linux
      - build-desktop-macos
      - build-desktop-windows
      - build-desktop-linux
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > "lingma-proxy_${RELEASE_TAG}_sha256.txt"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: artifacts/*

  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lutiancheng1/lingma-proxy:${{ env.RELEASE_TAG }}
            ghcr.io/lutiancheng1/lingma-proxy:latest
