name: Release (fork CLI)

# Fork-only CLI release. Kept separate from release.yml so a PR back upstream
# stays clean. Manual dispatch only (does not trigger on tag push), so it never
# double-runs alongside the upstream release.yml (which triggers on "v*").
# The tag is created by the release step on the ref you dispatch from.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.6.12-morpheus.1"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify synced version files
        run: ./scripts/check-version-sync.sh

      - name: Verify release notes entry
        run: ./scripts/check-release-notes.sh

      - name: Run tests
        run: go test ./internal/... ./cmd/...

  build-cli-macos:
    name: Build CLI macOS
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/lingma-proxy ./cmd/lingma-ipc-proxy
          tar -C dist -czf "lingma-proxy_${RELEASE_TAG}_darwin_arm64.tar.gz" lingma-proxy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-macos
          path: lingma-proxy_${{ env.RELEASE_TAG }}_darwin_arm64.tar.gz

  build-cli-windows:
    name: Build CLI Windows
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI
        shell: pwsh
        run: |
          .\scripts\build.ps1 -Clean
          $asset = "lingma-proxy_${env:RELEASE_TAG}_windows_amd64.zip"
          Compress-Archive -Path .\dist\lingma-proxy.exe -DestinationPath $asset -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-windows
          path: lingma-proxy_${{ env.RELEASE_TAG }}_windows_amd64.zip

  build-cli-linux:
    name: Build CLI Linux
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -ldflags "-s -w" -o dist/lingma-proxy ./cmd/lingma-ipc-proxy
          tar -C dist -czf "lingma-proxy_${RELEASE_TAG}_linux_${{ matrix.arch }}.tar.gz" lingma-proxy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: lingma-proxy_${{ env.RELEASE_TAG }}_linux_${{ matrix.arch }}.tar.gz

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-cli-macos
      - build-cli-windows
      - build-cli-linux
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cli-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > "lingma-proxy_${RELEASE_TAG}_sha256.txt"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: artifacts/*
